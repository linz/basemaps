<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Maplibre WGS84 Swipe between raster and vector maps Demo</title>
    <meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no" />
    <link href="https://unpkg.com/maplibre-gl@6.16.0/dist/maplibre-gl.css" rel="stylesheet" />
    <link
      rel="stylesheet"
      href="https://unpkg.com/@maplibre/maplibre-gl-compare@0.5.0/dist/maplibre-gl-compare.css"
      type="text/css"
    />
    <style>
      body {
        margin: 0;
        padding: 0;
        overflow: hidden;
      }

      body * {
        -webkit-touch-callout: none;
        -webkit-user-select: none;
        -moz-user-select: none;
        -ms-user-select: none;
        user-select: none;
      }

      .map {
        position: absolute;
        top: 0;
        bottom: 0;
        width: 100%;
      }
    </style>
  </head>
  <body>
    <div id="comparison-container">
      <div id="raster" class="map"></div>
      <div id="vector" class="map"></div>
    </div>
    <script type="module">
      import * as maplibregl from 'https://unpkg.com/maplibre-gl@6.16.0/dist/maplibre-gl.mjs';
      import Compare from 'https://cdn.jsdelivr.net/npm/@maplibre/maplibre-gl-compare@0.5.0/+esm';

      const apiKey = localStorage.getItem('api-key');
      if (!apiKey) {
        throw new Error('Missing api-key in localStorage');
      }

      // vector layers
      const styleUrl =
        'https://basemaps.linz.govt.nz/v1/tiles/topographic/EPSG:3857/style/topographic.json?api=' + apiKey;

      // Raster layers
      const url = 'https://basemaps.linz.govt.nz/v1/tiles/aerial/EPSG:3857/{z}/{x}/{y}.webp?api=' + apiKey;

      const startPos = [173, -40.5];
      const startZoom = 6;

      var raster = new maplibregl.Map({
        container: 'raster', // Container ID
        style: {
          version: 8,
          sources: {
            'raster-tiles': {
              type: 'raster',
              tiles: [url],
              tileSize: 256,
            },
          },
          layers: [
            {
              id: 'LINZ Raster Basemaps',
              type: 'raster',
              source: 'raster-tiles',
            },
          ],
        },
        center: startPos,
        zoom: startZoom,
      });

      var vector = new maplibregl.Map({
        container: 'vector', // Container ID
        style: styleUrl,
        center: startPos,
        zoom: startZoom,
      });

      // A selector or reference to HTML element
      var container = '#comparison-container';

      new Compare(raster, vector, container, {
        mousemove: true, // Optional. Set to true to enable swiping during cursor movement.
        orientation: 'vertical', // Optional. Sets the orientation of swiper to horizontal or vertical, defaults to vertical
      });
    </script>
  </body>
</html>
