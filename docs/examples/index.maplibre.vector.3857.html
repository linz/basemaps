<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Maplibre WGS84 Topographic Vector Basemaps Demo</title>
    <meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no" />
    <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@6.16.0/dist/maplibre-gl.css" />
    <style>
      body {
        margin: 0;
        padding: 0;
      }

      #map {
        position: absolute;
        top: 0;
        bottom: 0;
        width: 100%;
      }
    </style>
  </head>

  <body>
    <div id="map"></div>
    <script type="importmap">
      {
        "imports": {
          "maplibre-gl": "https://unpkg.com/maplibre-gl@6.16.0/dist/maplibre-gl.mjs"
        },
        "integrity": {
          "https://unpkg.com/maplibre-gl@6.16.0/dist/maplibre-gl.mjs": "sha384-uLwQnFL74rrONqIWx/ubL4wcAtA2h08tbMDZd9U4KbQ7GhaA7S1XKepHU89UkU7C"
        }
      }
    </script>
    <script type="module">
      import * as maplibregl from 'maplibre-gl';

      const startPos = [173, -40.5];
      const startZoom = 6;

      // vector layers
      const style =
        'https://basemaps.linz.govt.nz/v1/tiles/topographic/WebMercatorQuad/style/topographic.json?api=d01hep5551e30kxb7w85hck49tp';
      var map = new maplibregl.Map({
        container: 'map', // container id
        style: style, // style URL
        center: startPos, // starting position [lng, lat]
        zoom: startZoom, // starting zoom
      });
    </script>
  </body>
</html>
